[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uploadkit-odoo"
version = "0.1.0"
description = "Odoo integration for UploadKit"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
authors = [{ name = "UploadKit" }]
keywords = ["uploadkit", "odoo", "upload"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Odoo",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "uploadkit>=0.2.0",
    "werkzeug>=2.0",
]

[project.optional-dependencies]
security = ["uploadkit-security>=0.2.0"]
dev = [
    "pytest>=8.0",
    "coverage>=7.0",
    "uploadkit-testing>=0.1.0",
    "uploadkit-security>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/uploadkit/uploadkit-odoo"
Repository = "https://github.com/uploadkit/uploadkit-odoo"

[tool.hatch.build.targets.wheel]
packages = ["src/uploadkit_odoo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
